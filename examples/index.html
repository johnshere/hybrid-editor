<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hybrid-editor 示例</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f0f0f0;
      }
      #editor-container {
        width: 100%;
        height: 400px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>hybrid-editor 示例</h1>
    <div id="editor-container"></div>

    <script type="module">
      import { HybridEditor } from '../packages/index.ts';

      const editor = new HybridEditor({
        el: '#editor-container',
        locale: {
          toolbar: {
            bold: '粗体',
            italic: '斜体',
          },
        },
        features: ['rich-text', 'vector', 'freehand'],
      });

      editor.mount();
    </script>
  </body>
</html>
